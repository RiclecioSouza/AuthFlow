<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo de autenticação</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>
    <section>
        <div class="container">
            <form action="" method="post" id="form">
                <h1>Inscreva-se</h1>

                <p>Já é membro? <a href="#" id="linkAcessar">Acessar</a></p>

                <label for="usuarioLogin">E-mail</label>
                <input type="email" id="usuario" placeholder="E-mail">

                <label for="senhaLogin">Senha</label>
                <input type="password" id="senha" placeholder="Senha" minlength="6" maxlength="10">

                <button type="button" onclick="SignUp()">Cadastrar-se</button>
            </form>

            <form id="formLogin" class="escondido">
                <h1>Acessar</h1>
                <p>Ainda não é membro? <a href="#" id="linkCadastrar">Inscreva-se</a></p>

                <label for="usuarioLogin">Usuário</label>
                <input type="text" id="usuarioLogin" placeholder="Usuário">

                <label for="senhaLogin">Senha</label>
                <input type="password" id="senhaLogin" placeholder="Senha">

                <button type="button" id="botaoLogin">Entrar</button>
            </form>
        </div>

        <div id="modal">
            <h1>Bem vindo <span id="name"></span></h1>
            <button onclick="fechar()">Fechar</button>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
